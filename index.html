<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.webmanifest"><title>Учёт СИ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18212b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:900px;margin:auto;padding:14px 14px 50px}h1{margin:4px 0 4px;font-size:25px}.muted{color:#6b7680;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:12px;padding:12px 15px;font-size:15px;background:#1565c0;color:#fff;cursor:pointer}.btn.secondary{background:#e6edf4;color:#19324a}.btn.danger{background:#c62828}.btn:disabled{opacity:.5;cursor:default}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat{background:#fff;border-radius:14px;padding:11px;text-align:center;box-shadow:0 1px 5px #0001}.num{font-size:24px;font-weight:750}.red{color:#c62828}.yellow{color:#a86d00}.green{color:#16833b}.search{width:100%;border:1px solid #cbd4dc;border-radius:12px;padding:13px;font-size:16px;background:#fff}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.select{flex:1;min-width:210px;border:1px solid #cbd4dc;border-radius:12px;padding:11px;font-size:14px;background:#fff}.list{margin-top:10px}.card{background:#fff;border-left:6px solid #16833b;border-radius:12px;padding:13px;margin:8px 0;box-shadow:0 1px 5px #0001;cursor:pointer}.card.warn{border-left-color:#d69b00}.card.expired{border-left-color:#c62828}.card .name{font-weight:700}.card .meta{font-size:13px;color:#66717b;margin-top:4px}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;font-size:12px;background:#e8f5eb}.badge.warn{background:#fff1c7}.badge.expired{background:#fde3e3}.panel{background:#fff;border-radius:14px;padding:15px;margin-top:12px;box-shadow:0 1px 5px #0001}.field{border-bottom:1px solid #edf0f2;padding:8px 0}.field b{display:block;color:#6b7680;font-size:12px;margin-bottom:3px}.field input{width:100%;padding:9px;border:1px solid #ccd5dd;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.hidden{display:none!important}.empty{text-align:center;padding:30px 10px;color:#6b7680}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}.modal>div{background:#fff;width:min(900px,100%);max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.modal h2{margin-top:0}.small{font-size:12px;color:#6b7680}.close{float:right;border:0;background:#eef1f4;border-radius:50%;width:34px;height:34px;font-size:22px;line-height:34px;cursor:pointer}.qrbox{width:100%;max-width:520px;margin:auto}.file{display:none}.listInfo{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0 5px}.loadMore{display:block;width:100%;margin:10px 0}.sheetNote{background:#fff;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;box-shadow:0 1px 5px #0001}.sheetNote b{font-size:15px}.errorNote{background:#fff3cd;color:#765500;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}.successNote{background:#e8f5eb;color:#216e39;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
</style></head><body><main class="app"><h1>Учёт средств измерений</h1><div class="muted">Работа с вашим Excel-файлом прямо на телефоне</div><div class="toolbar"><label class="btn" for="excel">📁 Выбрать Excel</label><input class="file" id="excel" type="file" accept=".xlsx,.xls"><button class="btn" id="scanBtn">📷 Сканировать QR</button><button class="btn secondary" id="saveBtn" disabled>💾 Сохранить Excel</button></div><div id="fileName" class="small">Файл не выбран</div><div id="loadInfo"></div><div class="stats"><div class="stat"><div id="total" class="num">—</div><div class="muted">Всего СИ</div></div><div class="stat"><div id="expired" class="num red">—</div><div class="muted">Просрочено</div></div><div class="stat"><div id="soon" class="num yellow">—</div><div class="muted">Менее 3 месяцев</div></div></div><input id="search" class="search" placeholder="🔎 Поиск по коду, названию или месту" disabled><div class="filters"><select id="sheetFilter" class="select" disabled><option value="">Все листы</option></select></div><div class="listInfo"><span id="shownInfo" class="small"></span></div><div id="list" class="list"><div class="empty">Загрузите Excel-файл.</div></div><button id="loadMore" class="btn secondary loadMore hidden">Показать ещё</button><div id="modal" class="modal hidden"><div><button class="close" id="close">×</button><div id="modalBody"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://unpkg.com/html5-qrcode"></script><script>
let wb=null, items=[], currentFileName='Перечень СИ.xlsx', visibleCount=300, scanner=null;
const H=['№ п/п','Наименование','Тип','Заводской номер','Год выпуска','Диапазон измерений','Класс точности','Место установки СИ','Объект установки','Подразделение','Дата установки','Межповерочный интервал, мес.','Дата последней поверки / калибровки','Поверка (П)/ Калибровка (К)'];
const HEADER_ALIASES=[
 ['№ п/п','№','номер','п/п'],
 ['наименование'],['тип'],['заводской номер','заводской №','зав. номер','зав.№'],['год выпуска'],['диапазон измерений','диапазон'],['класс точности'],['место установки си','место установки'],['объект установки','объект'],['подразделение'],['дата установки'],['межповерочный интервал','межповерочный интервал, мес.','интервал поверки'],['дата последней поверки / калибровки','дата последней поверки','последняя поверка','дата поверки'],['поверка (п)/ калибровка (к)','поверка / калибровка','поверка','калибровка']
];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const n=x=>String(x??'').trim().toLowerCase().replaceAll('ё','е').replace(/[\n\r\t]+/g,' ').replace(/\s+/g,' ');
function headerRow(a){for(let i=0;i<a.length;i++){let row=a[i]||[];let hasName=row.some(x=>n(x)==='наименование');let hasSerial=row.some(x=>{let z=n(x);return z==='заводской номер'||z==='заводской №'||z.includes('заводской номер')||z.includes('зав. номер')});if(hasName&&hasSerial)return i}return -1}
function headerMap(row){let map=new Array(H.length).fill(-1);(row||[]).forEach((cell,c)=>{let z=n(cell);HEADER_ALIASES.forEach((aliases,i)=>{if(map[i]<0&&aliases.some(a=>z===a||z.includes(a)&&a.length>8))map[i]=c})});return map}
function looksLikeDeviceRow(r){if(!r||r.length<4)return false;let name=n(r[1]);let serial=n(r[3]);let type=n(r[2]);let place=n(r[7]);let obj=n(r[8]);return !!name&&name!=='наименование'&&!name.includes('журнал')&&!name.includes('перечень')&&!/^\d+$/.test(name)&&(!!serial||!!type||!!place||!!obj)}
function looksLikeDataSheet(a){let hits=0;for(let i=0;i<a.length;i++){let r=a[i]||[];if(looksLikeDeviceRow(r))hits++}return hits>=2}
function canonicalValues(r,map){let out=new Array(14).fill('');for(let i=0;i<14;i++){let c=map[i];out[i]=c>=0?(r[c]??''):''}return out}
function isControlled(r){let name=n(r[1]);return name.includes('манометр')||name==='термометр биметаллический'||name.includes('термометр биметаллический')}
function parseMark(v){if(v==null||v==='')return null;if(v instanceof Date&&!isNaN(v)){let d=new Date(v);d.setHours(0,0,0,0);return d}if(typeof v==='number'){let d=XLSX.SSF.parse_date_code(v);if(d)return new Date(d.y,d.m-1,d.d)}let s=String(v).trim().toUpperCase().replace(/\s+/g,'').replaceAll('К','K').replaceAll('В','V');let m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1])}m=s.match(/^(\d{1,2})K(\d{2,4})$/);if(m){let q=+m[1],y=+m[2];if(y<100)y+=2000;return new Date(y,q*3,0)}m=s.match(/^(\d{2,4}).*?(\d)K$/);if(m){let y=+m[1];if(y<100)y+=2000;let q=+m[2];return new Date(y,q*3,0)}m=s.match(/^[A-ZА-Я]+(\d{2,4})$/)||s.match(/^(\d{2,4})[A-ZА-Я]+$/);if(m){let y=+m[1];if(y<100)y+=2000;return new Date(y,11,31)}return null}
function dueDate(r){if(!isControlled(r))return null;let d=parseMark(r[12]);if(!d)return null;let months=parseInt(String(r[11]??'').replace(',','.').match(/\d+/)?.[0]||'12',10);if(!Number.isFinite(months)||months<=0)months=12;let due=new Date(d);due.setMonth(due.getMonth()+months);due.setHours(0,0,0,0);return due}
function state(r){let d=dueDate(r);if(!d)return {t:'normal',d:null};let now=new Date();now.setHours(0,0,0,0);let soon=new Date(now);soon.setMonth(soon.getMonth()+3);return {t:d<now?'expired':d<soon?'warn':'ok',d}}
function parseWorkbook(){items=[];let detectedSheets=[];let skippedSheets=[];wb.SheetNames.forEach((sn,si)=>{let ws=wb.Sheets[sn],a=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});if(!a.length){skippedSheets.push({name:sn,reason:'пустой'});return}let hi=headerRow(a);let map, start;let mode='header';if(hi>=0){map=headerMap(a[hi]);if(map[1]<0||map[3]<0){skippedSheets.push({name:sn,reason:'неполный заголовок'});return}start=hi+1}else if(looksLikeDataSheet(a)){map=new Array(14).fill(0).map((_,i)=>i);start=0;mode='data-only'}else{skippedSheets.push({name:sn,reason:'не похож на таблицу СИ'});return}let count=0;a.slice(start).forEach((r,ri)=>{let vals=canonicalValues(r,map);if(looksLikeDeviceRow(vals)){items.push({sheet:sn,sheetIndex:si,row:start+ri+1,values:vals,colMap:map.slice(),mode});count++}});if(count)detectedSheets.push({name:sn,count,mode})});return {detectedSheets,skippedSheets}}
function recalc(){let ss=items.map(x=>state(x.values));total.textContent=items.length;expired.textContent=ss.filter(x=>x.t==='expired').length;soon.textContent=ss.filter(x=>x.t==='warn').length}
function filteredItems(){let q=n(search.value),sh=sheetFilter.value;return items.filter(it=>(!sh||it.sheet===sh)&&(!q||[it.values[3],it.values[1],it.values[2],it.values[7],it.values[8],it.values[9],it.sheet].some(v=>n(v).includes(q))))}
function render(list){let shown=list.slice(0,visibleCount);shownInfo.textContent=list.length?`Показано ${shown.length} из ${list.length}`:'';if(!list.length){document.querySelector('#list').innerHTML='<div class="empty">Ничего не найдено.</div>';loadMore.classList.add('hidden');return}document.querySelector('#list').innerHTML=shown.map(it=>{let idx=items.indexOf(it),s=state(it.values),cl=s.t==='expired'?'expired':s.t==='warn'?'warn':'',txt=s.t==='expired'?'🔴 Просрочено':s.t==='warn'?'🟡 Менее 3 месяцев':'🟢 Годен';return `<div class="card ${cl}" onclick="openItem(${idx})"><div class="name">${esc(it.values[1]||'СИ')} · ${esc(it.values[3]||'б/н')}</div><div class="meta">${esc(it.values[7]||'Место установки не указано')} · ${esc(it.sheet)}</div><span class="badge ${cl}">${txt}${s.d?' · до '+s.d.toLocaleDateString('ru-RU'):''}</span></div>`}).join('');if(shown.length<list.length)loadMore.classList.remove('hidden');else loadMore.classList.add('hidden')}
function refresh(){visibleCount=300;recalc();render(filteredItems())}
function populateSheets(sheets){sheetFilter.innerHTML='<option value="">Все листы</option>'+sheets.map(s=>`<option value="${esc(s.name).replace(/"/g,'&quot;')}">${esc(s.name)} — ${s.count}</option>`).join('');sheetFilter.disabled=sheets.length===0}
function openItem(idx){let it=items[idx],r=it.values,s=state(r);let body=`<h2>${esc(r[1]||'СИ')} · ${esc(r[3]||'б/н')}</h2><div class="small">Лист: ${esc(it.sheet)}, строка: ${it.row}</div><div class="badge ${s.t==='expired'?'expired':s.t==='warn'?'warn':''}">${s.t==='expired'?'🔴 Просрочено':s.t==='warn'?'🟡 Менее 3 месяцев':'🟢 Годен'}${s.d?' · до '+s.d.toLocaleDateString('ru-RU'):''}</div>`;body+=`<div>${H.map((h,j)=>`<div class="field"><b>${esc(h)}</b><input id="f${j}" value="${esc(r[j]??'').replace(/"/g,'&quot;')}"></div>`).join('')}</div><div class="actions"><button class="btn" onclick="editItem(${idx})">Сохранить изменения</button><button class="btn danger" onclick="deleteItem(${idx})">Удалить СИ</button><button class="btn secondary" onclick="closeModal()">Закрыть</button></div>`;document.querySelector('#modalBody').innerHTML=body;document.querySelector('#modal').classList.remove('hidden')}
function editItem(idx){let it=items[idx],ws=wb.Sheets[it.sheet];for(let j=0;j<14;j++)it.values[j]=document.querySelector('#f'+j).value;for(let j=0;j<14;j++){let c=it.colMap[j];if(c>=0)ws[XLSX.utils.encode_cell({r:it.row-1,c})]={t:'s',v:it.values[j]}}recalc();render(filteredItems());openItem(idx);saveBtn.disabled=false}
function deleteItem(idx){if(!confirm('Удалить это СИ из Excel?'))return;let it=items[idx],ws=wb.Sheets[it.sheet],a=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});a.splice(it.row-1,1);wb.Sheets[it.sheet]=XLSX.utils.aoa_to_sheet(a);items.splice(idx,1);recalc();render(filteredItems());closeModal();saveBtn.disabled=false}
function closeModal(){document.querySelector('#modal').classList.add('hidden')}
document.querySelector('#close').onclick=closeModal;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
excel.onchange=e=>{let f=e.target.files[0];if(!f)return;currentFileName=f.name;fileName.textContent=f.name;let rd=new FileReader();rd.onload=ev=>{try{wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});let info=parseWorkbook();recalc();populateSheets(info.detectedSheets);search.disabled=false;saveBtn.disabled=false;visibleCount=300;render(filteredItems());loadInfo.innerHTML=`<div class="successNote">Обработано листов: <b>${info.detectedSheets.length}</b> из ${wb.SheetNames.length}. Найдено СИ: <b>${items.length}</b>.</div>`;if(info.skippedSheets.length){loadInfo.innerHTML+=`<div class="sheetNote"><b>Не включены:</b> ${info.skippedSheets.map(x=>esc(x.name)+' — '+esc(x.reason)).join('; ')}.</div>`} }catch(err){alert('Не удалось прочитать Excel: '+err.message)}};rd.readAsArrayBuffer(f)};
search.oninput=refresh;sheetFilter.onchange=refresh;loadMore.onclick=()=>{visibleCount+=300;render(filteredItems())};saveBtn.onclick=()=>{if(!wb)return;XLSX.writeFile(wb,currentFileName.replace(/\.xlsx?$/i,'')+'_изменён.xlsx')};
function addQR(parts,best){if(!wb){alert('Сначала загрузите Excel.');return}let target=best?.it;if(!target){alert('Не найден лист для добавления.');return}let ws=wb.Sheets[target.sheet],a=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});let pos=target.row;let vals=parts.slice(0,14);let row=new Array(Math.max(14,ws['!ref']?XLSX.utils.decode_range(ws['!ref']).e.c+1:14)).fill('');vals.forEach((v,i)=>{let c=target.colMap[i]>=0?target.colMap[i]:i;row[c]=v});a.splice(pos-1,0,row);wb.Sheets[target.sheet]=XLSX.utils.aoa_to_sheet(a);let info=parseWorkbook();populateSheets(info.detectedSheets);refresh();saveBtn.disabled=false;alert('СИ добавлено в лист «'+target.sheet+'».')}
function score(a,b){let ix=[1,2,5,6,7,8];return ix.reduce((s,i)=>s+(n(a[i])&&n(a[i])===n(b[i])?1:0),0)}
function handleQR(txt){let parts=txt.split(',').map(x=>x.trim());stopScan();if(parts.length<14){alert('В QR найдено '+parts.length+' полей. Ожидается 14.');return}let code=n(parts[3]);let found=items.find(it=>code&&n(it.values[3])===code);if(found){openItem(items.indexOf(found));return}let best=items.map(it=>({it,score:score(parts,it.values)})).sort((a,b)=>b.score-a.score)[0];let msg='СИ не найдено в таблице.'+(best?`\nНаиболее похожая запись: ${best.it.values[1]||''}, место: ${best.it.values[7]||''}, лист: ${best.it.sheet}, совпадение ${best.score}/6.`:'');if(confirm(msg+'\n\nДобавить данные из QR в наиболее подходящую строку?'))addQR(parts,best)}
scanBtn.onclick=()=>startScan();async function startScan(){if(scanner)return;let div=document.createElement('div');div.id='qrwrap';div.innerHTML='<div class="modal"><div><button class="close" onclick="stopScan()">×</button><h2>Сканирование QR</h2><div id="reader" class="qrbox"></div><div class="small">QR должен содержать 14 полей слева направо через запятую.</div></div></div>';document.body.appendChild(div);scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},txt=>handleQR(txt))}catch(e){alert('Не удалось открыть камеру. Для камеры нужен HTTPS и разрешение браузера.');stopScan()}}
async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}document.querySelector('#qrwrap')?.remove()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
