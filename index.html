<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.webmanifest"><title>Учёт СИ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18212b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:900px;margin:auto;padding:14px 14px 50px}h1{margin:4px 0 4px;font-size:25px}.muted{color:#6b7680;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:12px;padding:12px 15px;font-size:15px;background:#1565c0;color:#fff}.btn.secondary{background:#e6edf4;color:#19324a}.btn.danger{background:#c62828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat{background:#fff;border-radius:14px;padding:11px;text-align:center;box-shadow:0 1px 5px #0001}.num{font-size:24px;font-weight:750}.red{color:#c62828}.yellow{color:#a86d00}.green{color:#16833b}.search{width:100%;border:1px solid #cbd4dc;border-radius:12px;padding:13px;font-size:16px;background:#fff}.list{margin-top:10px}.card{background:#fff;border-left:6px solid #16833b;border-radius:12px;padding:13px;margin:8px 0;box-shadow:0 1px 5px #0001}.card.warn{border-left-color:#d69b00}.card.expired{border-left-color:#c62828}.card .name{font-weight:700}.card .meta{font-size:13px;color:#66717b;margin-top:4px}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;font-size:12px;background:#e8f5eb}.badge.warn{background:#fff1c7}.badge.expired{background:#fde3e3}.panel{background:#fff;border-radius:14px;padding:15px;margin-top:12px;box-shadow:0 1px 5px #0001}.field{border-bottom:1px solid #edf0f2;padding:8px 0}.field b{display:block;color:#6b7680;font-size:12px;margin-bottom:3px}.field input{width:100%;padding:9px;border:1px solid #ccd5dd;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.hidden{display:none!important}.empty{text-align:center;padding:30px 10px;color:#6b7680}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}.modal>div{background:#fff;width:min(900px,100%);max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.modal h2{margin-top:0}.small{font-size:12px;color:#6b7680}.close{float:right;border:0;background:#eef1f4;border-radius:50%;width:34px;height:34px}.qrbox{width:100%;max-width:520px;margin:auto}.suggest{background:#f7f9fb;border-radius:10px;padding:10px;margin-top:8px}.file{display:none}
</style></head><body><main class="app"><h1>Учёт средств измерений</h1><div class="muted">Работа с вашим Excel-файлом прямо на телефоне</div><div class="toolbar"><label class="btn" for="excel">📁 Выбрать Excel</label><input class="file" id="excel" type="file" accept=".xlsx,.xls"><button class="btn" id="scanBtn">📷 Сканировать QR</button><button class="btn secondary" id="saveBtn" disabled>💾 Сохранить Excel</button></div><div id="fileName" class="small">Файл не выбран</div><div class="stats"><div class="stat"><div id="total" class="num">—</div><div class="muted">Всего СИ</div></div><div class="stat"><div id="expired" class="num red">—</div><div class="muted">Просрочено</div></div><div class="stat"><div id="soon" class="num yellow">—</div><div class="muted">Менее 3 месяцев</div></div></div><input id="search" class="search" placeholder="🔎 Поиск по коду, названию или месту" disabled><div id="list" class="list"><div class="empty">Загрузите Excel-файл.</div></div><div id="modal" class="modal hidden"><div><button class="close" id="close">×</button><div id="modalBody"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://unpkg.com/html5-qrcode"></script><script>
let wb=null, items=[], currentFileName='Перечень СИ.xlsx', headers=[];
const H=['№ п/п','Наименование','Тип','Заводской номер','Год выпуска','Диапазон измерений','Класс точности','Место установки СИ','Объект установки','Подразделение','Дата установки','Межповерочный интервал, мес.','Дата последней поверки / калибровки','Поверка (П)/ Калибровка (К)'];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const n=x=>String(x??'').trim().toLowerCase().replaceAll('ё','е').replace(/\s+/g,' ');
function headerRow(a){return a.findIndex(r=>r.some(x=>n(x)==='наименование')&&r.some(x=>n(x).includes('заводской номер')))||-1}
function isDeviceRow(r){if(!r||r.length<2)return false;let name=n(r[1]);return !!name && name!=='наименование' && !/^\d+$/.test(name) && !name.includes('журнал') && !name.includes('перечень')}
function isControlled(r){let name=n(r[1]);return name.includes('манометр')||name==='термометр биметаллический'}
function parseMark(v){if(v==null||v==='')return null;if(v instanceof Date&&!isNaN(v)){let d=new Date(v);d.setHours(0,0,0,0);d.setFullYear(d.getFullYear()+1);return d}if(typeof v==='number'){let d=XLSX.SSF.parse_date_code(v);if(d){let x=new Date(d.y,d.m-1,d.d);x.setFullYear(x.getFullYear()+1);return x}}
let s=String(v).trim().toUpperCase().replace(/\s+/g,'').replaceAll('К','K').replaceAll('КВ','K');
let m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;let d=new Date(y,+m[2]-1,+m[1]);d.setFullYear(y+1);return d}
// quarter + year: 3K24, 3K2024, 24DYAU2K, 2K24, 24DYAU2
m=s.match(/^(\d{1,2})K(\d{2,4})$/);if(m){let q=+m[1],y=+m[2];if(y<100)y+=2000;return new Date(y+1,q*3,0)}
m=s.match(/^(\d{2,4}).*?(\d)K$/);if(m){let y=+m[1];if(y<100)y+=2000;let q=+m[2];return new Date(y+1,q*3,0)}
m=s.match(/^[A-ZА-Я]+(\d{2,4})$/)||s.match(/^(\d{2,4})[A-ZА-Я]+$/);if(m){let y=+m[1];if(y<100)y+=2000;return new Date(y+1,11,31)}
// common variants such as 2КВ2022 / 2КВ24
m=s.match(/^(\d)K(?:V)?(\d{2,4})$/);if(m){let q=+m[1],y=+m[2];if(y<100)y+=2000;return new Date(y+1,q*3,0)}return null}
function state(r){if(!isControlled(r))return {t:'normal',d:null};let d=parseMark(r[12]);if(!d)return {t:'normal',d:null};let now=new Date();now.setHours(0,0,0,0);let soon=new Date(now);soon.setMonth(soon.getMonth()+3);return {t:d<now?'expired':d<soon?'warn':'ok',d}}
function load(){items=[];headers=H.slice();wb.SheetNames.forEach((sn,si)=>{let ws=wb.Sheets[sn], a=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});let hi=headerRow(a);if(hi<0)return;a.slice(hi+1).forEach((r,ri)=>{if(isDeviceRow(r))items.push({sheet:sn,sheetIndex:si,row:hi+ri+2,values:r.slice(0,14)})})});recalc();render(items)}
function recalc(){let ss=items.map(x=>state(x.values));total.textContent=items.length;expired.textContent=ss.filter(x=>x.t==='expired').length;soon.textContent=ss.filter(x=>x.t==='warn').length}
function render(list){if(!list.length){document.querySelector('#list').innerHTML='<div class="empty">Ничего не найдено.</div>';return}document.querySelector('#list').innerHTML=list.slice(0,300).map((it,i)=>{let s=state(it.values),cl=s.t==='expired'?'expired':s.t==='warn'?'warn':'',txt=s.t==='expired'?'🔴 Просрочено':s.t==='warn'?'🟡 Менее 3 месяцев':'🟢 Годен';return `<div class="card ${cl}" onclick="openItem(${items.indexOf(it)})"><div class="name">${esc(it.values[1]||'СИ')} · ${esc(it.values[3]||'б/н')}</div><div class="meta">${esc(it.values[7]||'Место установки не указано')} · ${esc(it.sheet)}</div><span class="badge ${cl}">${txt}${s.d?' · до '+s.d.toLocaleDateString('ru-RU'):''}</span></div>`}).join('')}
function openItem(idx){let it=items[idx],r=it.values,s=state(r);let body=`<h2>${esc(r[1]||'СИ')} · ${esc(r[3]||'б/н')}</h2><div class="small">Лист: ${esc(it.sheet)}, строка: ${it.row}</div><div class="badge ${s.t==='expired'?'expired':s.t==='warn'?'warn':''}">${s.t==='expired'?'🔴 Просрочено':s.t==='warn'?'🟡 Менее 3 месяцев':'🟢 Годен'}${s.d?' · до '+s.d.toLocaleDateString('ru-RU'):''}</div>`;body+='<div>'+H.map((h,j)=>`<div class="field"><b>${esc(h)}</b><input id="f${j}" value="${esc(r[j]??'').replace(/"/g,'&quot;')}"></div>`).join('')+'</div><div class="actions"><button class="btn" onclick="editItem('+idx+')">Сохранить изменения</button><button class="btn danger" onclick="deleteItem('+idx+')">Удалить СИ</button><button class="btn secondary" onclick="closeModal()">Закрыть</button></div>';document.querySelector('#modalBody').innerHTML=body;document.querySelector('#modal').classList.remove('hidden')}
function editItem(idx){let it=items[idx];for(let j=0;j<14;j++)it.values[j]=document.querySelector('#f'+j).value;let ws=wb.Sheets[it.sheet];for(let j=0;j<14;j++)ws[XLSX.utils.encode_cell({r:it.row-1,c:j})]={t:'s',v:it.values[j]};recalc();render(items);openItem(idx);document.querySelector('#saveBtn').disabled=false}
function deleteItem(idx){if(!confirm('Удалить это СИ из Excel?'))return;let it=items[idx],ws=wb.Sheets[it.sheet],a=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});a.splice(it.row-1,1);wb.Sheets[it.sheet]=XLSX.utils.aoa_to_sheet(a);items.splice(idx,1);recalc();render(items);closeModal();document.querySelector('#saveBtn').disabled=false}
function closeModal(){document.querySelector('#modal').classList.add('hidden')}
document.querySelector('#close').onclick=closeModal;
document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.querySelector('#excel').onchange=e=>{let f=e.target.files[0];if(!f)return;currentFileName=f.name;fileName.textContent=f.name;let rd=new FileReader();rd.onload=ev=>{try{wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});load();search.disabled=false;saveBtn.disabled=false}catch(err){alert('Не удалось прочитать Excel: '+err.message)}};rd.readAsArrayBuffer(f)};
search.oninput=e=>{let q=n(e.target.value);render(!q?items:items.filter(it=>[it.values[3],it.values[1],it.values[2],it.values[7],it.values[8],it.values[9]].some(v=>n(v).includes(q))))};
saveBtn.onclick=()=>{if(!wb)return;XLSX.writeFile(wb,currentFileName.replace(/\.xlsx?$/i,'')+'_изменён.xlsx')};
let scanner=null;scanBtn.onclick=()=>startScan();async function startScan(){if(scanner)return;let div=document.createElement('div');div.id='qrwrap';div.innerHTML='<div class="modal"><div><button class="close" onclick="stopScan()">×</button><h2>Сканирование QR</h2><div id="reader" class="qrbox"></div><div class="small">QR должен содержать 14 полей слева направо через запятую.</div></div></div>';document.body.appendChild(div);scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},txt=>handleQR(txt))}catch(e){alert('Не удалось открыть камеру. Для камеры нужен HTTPS и разрешение браузера.');stopScan()}}
async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}document.querySelector('#qrwrap')?.remove()}
function handleQR(txt){let parts=txt.split(',').map(x=>x.trim());stopScan();if(parts.length<14){alert('В QR найдено '+parts.length+' полей. Ожидается 14.');return}let code=n(parts[3]);let found=items.find(it=>code&&n(it.values[3])===code);if(found){openItem(items.indexOf(found));return}let best=items.map(it=>({it,score:score(parts,it.values)})).sort((a,b)=>b.score-a.score)[0];let msg='СИ не найдено в таблице.'+(best?`\nНаиболее похожая запись: ${best.it.values[1]||''}, место: ${best.it.values[7]||''}, совпадение ${best.score}/6.`:'');if(confirm(msg+'\n\nДобавить данные из QR в наиболее подходящую строку/группу?'))addQR(parts,best?.it)}
function score(a,b){let ix=[1,2,5,6,7,8];return ix.reduce((s,i)=>s+(n(a[i])&&n(a[i])===n(b[i])?1:0),0)}
function addQR(parts,best){if(!wb){alert('Сначала загрузите Excel.');return}let target=best?.it;if(!target){alert('Не найден лист для добавления.');return}let ws=wb.Sheets[target.sheet],a=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});let pos=target.row;let vals=parts.slice(0,14);vals[0]=a.length; a.splice(pos-1,0,vals);wb.Sheets[target.sheet]=XLSX.utils.aoa_to_sheet(a);load();saveBtn.disabled=false;alert('СИ добавлено в лист «'+target.sheet+'» рядом с подходящей группой.');}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
